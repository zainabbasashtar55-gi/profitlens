services:
  - type: web
    name: profitlens
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: ProfitLens
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: TENANCY_POSTGRES_SCHEMAS
        value: "true"
      - key: APP_URL
        sync: false
      - key: TENANT_DOMAIN
        sync: false
      - key: CENTRAL_DOMAINS
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: MAIL_MAILER
        value: log
